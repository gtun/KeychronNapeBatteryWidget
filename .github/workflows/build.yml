name: Build AppImage

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: |
          python3 -m pip install pytest
          python3 -m pytest -q tests

      - name: Install Python dependencies into AppDir
        run: python3 -m pip install --prefix=/usr --root=AppDir -r requirements.txt

      - name: Build AppImage
        uses: AppImageCrafters/build-appimage-action@master
        with:
          recipe: build-scripts/AppImageBuilder.yml

      - uses: actions/upload-artifact@v4
        with:
          name: KeychronNapeBatteryWidget
          path: './*.AppImage*'

      - name: Attach to draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: './*.AppImage*'
          draft: true

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build exe
        shell: pwsh
        run: .\build-scripts\build_windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: KeychronNapeBatteryWidget-windows
          path: dist/KeychronNapeBatteryWidget.exe

      - name: Attach to draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/KeychronNapeBatteryWidget.exe
          draft: true
